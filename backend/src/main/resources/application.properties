server.port=8080
spring.application.name=urban-risk-backend

# H2 en memoria para trazabilidad de consultas
spring.datasource.url=jdbc:h2:mem:urbanriskdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# URL del servicio ML (Python FastAPI)
ml.service.url=http://ml-service:8000

# CORS
spring.web.cors.allowed-origins=*

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
