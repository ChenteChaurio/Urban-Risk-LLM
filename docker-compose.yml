version: "3.9"

services:

  # ── Servicio ML + RAG (Python FastAPI) ──────────────────────────────────
  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    container_name: urban-risk-ml
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
    environment:
      - PYTHONUNBUFFERED=1
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_API_URL=${GROQ_API_URL:-https://api.groq.com/openai/v1/chat/completions}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s   # tiempo para entrenar modelos al inicio
    networks:
      - urban-net

  # ── Backend Spring Boot ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urban-risk-backend
    ports:
      - "8080:8080"
    environment:
      - ML_SERVICE_URL=http://ml-service:8000
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:urbanriskdb;DB_CLOSE_DELAY=-1
    depends_on:
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - urban-net

  # ── Frontend React (Nginx) ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: urban-risk-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8080/api
    depends_on:
      - backend
    networks:
      - urban-net

networks:
  urban-net:
    driver: bridge
